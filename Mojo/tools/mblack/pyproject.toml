[project]
authors = [{name = "Alex Trotta", email = "ahajha@gmail.com"}]
dependencies = []
name = "mblack"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "https://conda.modular.com/max-nightly"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
mojo = ">=1.1.0.dev2026082605"

[tool.pixi.pypi-dependencies]
mblack = { path = ".", editable = true }

[tool.pixi.tasks]
main = "mojo run main.mojo"

[tool.ty.environment]
extra-paths = [
    "src",
]
